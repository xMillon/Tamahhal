<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمهّل — قبل ما تضغط</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <header>
        <h1>تمهّل</h1>
        <p class="tagline">قبل ما تضغط، تمهّل.</p>
        </header>

        <label for="message">نص الرسالة</label>
        <textarea id="message" rows="6" placeholder="الصق الرسالة هنا"></textarea>

        <label for="sender">من أرسل الرسالة؟ <span class="optional">(اختياري)</span></label>
        <input id="sender" type="text" placeholder="رقم أو اسم المرسل">

        <button id="check">افحص الرسالة</button>

        <section id="result"></section>

        <p id="preview"></p>

        <p class="privacy">الرسالة ما تطلع من جهازك.</p>
    </main>
</body>
</html>
