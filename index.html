<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمهل - قبل ماتضغط</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <h1>تمهل</h1>
        <p>تمهل، قبل ماتضغط</p>

        <label for="message">نص الرسالة</label>
        <textarea id="message" rows="6"></textarea>

        <label for="sender">من ارسل الرسالة؟ (اختياري)</label>
        <input id="sender" type="text">

        <button id="chech">افحص الرسالة</button>

        <section id="result"></section>

        <p>تنويه: الرسالة لاتغادر جهازك</p>
    </main>
</body>
